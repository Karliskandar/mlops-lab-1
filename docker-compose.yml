services:
  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow-data

  inference:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      - inference

volumes:
  mlflow-data: